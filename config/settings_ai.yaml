env: "paper"    # paper or live

# Strategy selection: "ai_pattern", "fvg", or "hybrid"
strategy_type: "ai_pattern"

timeframes:
  primary: "1min"       # Primary trading timeframe (1min = fresher data, less staleness)
  confirm: "5min"       # Confirmation timeframe
  trend: "15min"        # Trend timeframe

# Primary timeframe used by all runners
timeframe: "1min"

ig:
  api_key: "${IG_API_KEY}"
  username: "${IG_USERNAME}"
  password: "${IG_PASSWORD}"
  account_type: "${IG_ACCOUNT_TYPE}"   # DEMO or LIVE

alphavantage:
  api_key: "${ALPHA_VANTAGE_KEY}"

12data:
  api_key: "${TWELVE_DATA_KEY}"

finnhub:
  api_key: "${FINNHUB_KEY}"

ml_filter:
  enabled: true
  probability_threshold: 0.50
  rolling_window_bars: 1000
  retrain_interval_hours: 2
  model_path: "data/ml_model.joblib"
  model_type: "logistic_regression"  # or "random_forest"

volatility_filter:
  enabled: true
  atr_period: 14
  lookback_bars: 100
  lower_percentile: 15.0
  upper_percentile: 85.0

risk:
  account_equity: 10000
  invest_per_trade: 1000
  max_loss_pct_invest: 5.0  # Max 5% of invested capital per trade
  max_daily_loss_pct: 3.0   # Stop trading if down 3% on the day
  max_losing_trades: 3      # Stop after 3 consecutive losses
  risk_pct_per_trade: 2.0
  equity_refresh_interval_seconds: 300
  use_dynamic_sizing: true
  max_size_multiple: 50

conditional_orders:
  enabled: true
  buffer_points: 2.0                # Points beyond S/R level for entry (0.5–50.0)
  order_expiry_seconds: 1800         # Auto-cancel unfilled orders after 5 min (60–86400)
  max_entry_distance_points: 30.0   # Reject signal if entry > 30 pts from mid-price (1.0–200.0)

execution:
  time_in_force: "FILL_OR_KILL"
  use_trailing_stop: true           # ✅ Enable trailing
  trailing_activation_pct: 0.3      # Activate after 30% of stop profit
  trailing_distance_pct: 0.6        # Keep 60% buffer
  trailing_poll_seconds: 10         # Poll IG price every 10s when trailing active
  use_tp_limit: false               # When false, no TP on order — trailing stop is sole exit

ai_strategy:
  confidence_threshold: 0.50
  enable_sr_detection: true         # ✅ Enable S/R detection

  # NEW: CFD-specific settings
  cfd_mode: true                    # Enable CFD optimizations
  min_movement_pct: 0.001           # 0.1% minimum (lower for 1min bars)
  pattern_confidence_boost: 1.3     # Multiply pattern confidence by 1.3x

  # Risk management — tuned for 1min bars
  atr_period: 14               # ATR period (14 x 1min = 14min lookback)
  stop_multiplier: 2.0         # Stop loss = ATR * multiplier (wider on 1min to avoid noise)
  min_stop_pts: 5.0            # Minimum stop distance in points (floor for Gold noise/spread)
  rr_take: 2.0                 # Risk/Reward ratio (1:2 means 2x profit target)
  lookback_candles: 250        # Use max TwelveData bars (250 = ~4 hours on 1min)

  # Pattern weights (future enhancement)
  pattern_weights:
    candlestick: 1.0
    chart_pattern: 1.2
    momentum: 0.8
    trend: 1.5

  # Advanced features
  enable_pattern_confluence: false   # Don't require multiple patterns (single strong pattern is enough)
  min_patterns_for_trade: 1          # 1 pattern sufficient when ML + volatility filters are active

  # Anti-churn: cooldown after stop loss (seconds)
  cooldown_after_sl: 600             # Wait 10 minutes after SL before new trade

# Data Source Priority
# System will try sources in this order
data_sources:
  # Primary (FREE)
  yahoo_finance:
    enabled: true
    priority: 2

  # Secondary (FREE tier available)
  twelve_data:
    enabled: true
    api_key: "${TWELVE_DATA_KEY}"
    priority: 1

  # Last resort
  alpha_vantage:
    enabled: false
    api_key: "${ALPHA_VANTAGE_KEY}"
    priority: 3

  # Fallback to IG
  ig_api:
    enabled: true
    priority: 4

# Instruments to trade
symbols:
  # Major Forex Pairs - Highly liquid
  # - "CS.D.EURUSD.CFD.IP"   # EUR/USD
  # - "CS.D.GBPUSD.CFD.IP"   # GBP/USD

  # Indices - Good for trending
  # - "IX.D.SPTRD.DAILY.IP"  # S&P 500
  # - "IX.D.FTSE.CFD.IP"     # FTSE 100

  # Commodities
  - "CS.D.CFEGOLD.CEB.IP"  # Gold
  # - "CMD.USCrude.CFD.IP"   # Crude Oil

logging:
  level: "DEBUG"  # DEBUG for detailed analysis, INFO for normal operation
  sink: "logs/ai_bot.log"

# Database for storing analysis results
db:
  url: "sqlite:///data/ai_trading.db"

# Performance tracking
analytics:
  save_all_decisions: true      # Log every AI decision
  generate_reports: true        # Auto-generate performance reports
  report_interval_minutes: 5    # How often to generate reports
  save_pattern_history: true    # Store detected patterns for learning

# FVG Multi-Timeframe Strategy Configuration
fvg_strategy:
  cycle_interval_seconds: 300    # 5 minutes between cycles
  timeframes:
    - "60min"
    - "15min"
    - "5min"
  fvg_max_age_bars: 100           # Expire FVGs older than 100 bars on their timeframe
  stop_buffer_points: 2.0        # Buffer beyond FVG boundary for stop
  min_bias_confidence: 0.6       # Minimum confidence to generate signal
  lookback_candles: 200          # Bars to fetch per timeframe

# ─── Sentiment Analysis Filter ─────────────────────────────────────────────
sentiment_filter:
  enabled: true
  sentiment_threshold: 0.3          # reject if score opposes direction beyond this
  cache_ttl_seconds: 300            # 5 minutes
  source_weights:
    ig_client: 0.6
    news: 0.4
  sources:
    ig_client:
      enabled: true
      market_id: "GOLD"
      timeout_seconds: 10
    news:
      enabled: true
      provider: "alpha_vantage"
      api_key: "${ALPHA_VANTAGE_KEY}"
      lookback_hours: 4
      min_articles: 3
      timeout_seconds: 15
      max_requests_per_hour: 5
